<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>StudyBuddy</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1d2a;--ac:#4f46e5;--me:#4f46e5;--mt:#fff;--bd:#e2e4ee}
@media(prefers-color-scheme:dark){:root{--bg:#12131a;--card:#1c1e2b;--tx:#e8e9f3;--bd:#2c2f42}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;max-width:860px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:700;font-size:20px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
#new{background:none;color:var(--ac);font-size:14px}
#modes{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}
#modes button{white-space:nowrap;padding:7px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;font-size:14px}
#modes button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#log{flex:1;overflow-y:auto;padding:8px 16px}
.m{max-width:88%;margin:8px 0;padding:10px 14px;border-radius:14px;line-height:1.5;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--bd)}
.m.user{margin-left:auto;background:var(--me);color:var(--mt);border-color:var(--me)}
.m.err{color:#c0392b}.m pre{background:rgba(127,127,127,.15);padding:8px;border-radius:8px;overflow-x:auto;white-space:pre-wrap}
.m code{background:rgba(127,127,127,.15);padding:1px 4px;border-radius:4px}
.hint{text-align:center;opacity:.6;margin-top:40px}
footer{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;max-height:140px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
#send{background:var(--ac);color:#fff;padding:0 18px}#send:disabled{opacity:.5}
</style></head><body>
<header><span>📚 StudyBuddy</span><button id="new">New chat</button></header>
<div id="modes"></div><main id="log"></main>
<footer><textarea id="in" rows="1" placeholder="Ask a question or paste your notes…"></textarea><button id="send">Send</button></footer>
<script>
const MODES=[['explain','Explain'],['summarize','Summarize notes'],['quiz','Quiz me'],['flashcards','Flashcards'],['essay','Essay help'],['solve','Step-by-step']];
const $=id=>document.getElementById(id);
let mode=localStorage.getItem('mode')||'explain',msgs=[],busy=false;
try{msgs=JSON.parse(localStorage.getItem('chat')||'[]');if(!Array.isArray(msgs))msgs=[]}catch{msgs=[]}
function save(){try{localStorage.setItem('chat',JSON.stringify(msgs.slice(-40)));localStorage.setItem('mode',mode)}catch{}}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmt(s){return s.split('```').map((p,i)=>i%2?'<pre>'+esc(p.replace(/^\w*\n/,''))+'</pre>':esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')).join('')}
function bubble(role,text,cls){const d=document.createElement('div');d.className='m '+role+(cls?' '+cls:'');d.innerHTML=fmt(text);$('log').appendChild(d);$('log').scrollTop=1e9;return d}
function render(){$('log').innerHTML='';if(!msgs.length)$('log').innerHTML='<div class="hint">Pick a mode above and ask your first question 🎓</div>';else msgs.forEach(m=>bubble(m.role,m.content))}
function drawModes(){$('modes').innerHTML='';MODES.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.className=k===mode?'on':'';b.onclick=()=>{mode=k;save();drawModes()};$('modes').appendChild(b)})}
async function send(){const t=$('in').value.trim();if(!t||busy)return;busy=true;$('send').disabled=true;$('in').value='';$('in').style.height='auto';
if(!msgs.length)$('log').innerHTML='';msgs.push({role:'user',content:t});bubble('user',t);const w=bubble('assistant','Thinking…');
try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,messages:msgs.slice(-20)})});
const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Server error '+r.status);
msgs.push({role:'assistant',content:j.reply});w.innerHTML=fmt(j.reply)}
catch(e){msgs.pop();w.className='m assistant err';w.innerHTML=fmt('⚠️ '+(e.message==='Failed to fetch'?'Cannot reach the server. Check your connection.':e.message))}
save();busy=false;$('send').disabled=false;$('log').scrollTop=1e9}
$('send').onclick=send;$('new').onclick=()=>{msgs=[];save();render()};
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'});
drawModes();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
